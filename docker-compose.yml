version: "3.9"

services:

  neo4j:
    image: neo4j:5.26-community
    container_name: dag_neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"   # Neo4j Browser (UI web)
      - "7687:7687"   # Bolt protocol -- Python driver (neo4j.GraphDatabase) dùng cổng này

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

      # ĐÃ ĐỔI: bỏ NEO4J_PLUGINS auto-download cho GDS -- cơ chế này cần
      # container tự curl ra https://graphdatascience.ninja/versions.json lúc
      # khởi động; nếu mạng (VPN/firewall công ty, DNS Docker Desktop trên
      # Windows...) chặn/lỗi domain đó, curl trả về rỗng hoặc trang lỗi HTML,
      # jq cố parse JSON từ đó ra lỗi "Invalid numeric literal" -- đúng lỗi bạn
      # gặp. APOC vẫn để auto-download vì version-list của APOC nằm ở domain
      # khác (GitHub releases), ổn định hơn trong thực tế.
      NEO4J_PLUGINS: '["apoc"]'

      # Bắt buộc để GDS/APOC được phép gọi các thủ tục hệ thống cấp thấp.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"

    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      # GDS cài bằng cách mount JAR đã tải sẵn -- xem hướng dẫn tải ở dưới file
      # này. Thư mục ./neo4j/plugins chỉ chứa đúng 1 file .jar của GDS (APOC đã
      # tự tải riêng, không đặt APOC .jar vào đây để tránh mount đè/trùng).
      - ./neo4j/plugins:/plugins

    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: dag_chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chroma:/chroma

# GHI CHÚ: đã bỏ 2 service "redis" và "postgres" so với bản đề xuất ban đầu.
# Lý do: SPEC.md §5 (Mock Components) ghi rõ:
#   - "Dữ liệu ngân hàng: JSON/CSV giả lập tài khoản off-chain" -- tức KHÔNG
#     cần Postgres thật cho MVP, chỉ cần data/mock/customers.json.
#   - "Xử lý thời gian thực: batch/simulate-stream, chưa dùng Kafka" -- tức
#     cũng không có nhu cầu Redis (thường dùng làm queue/cache cho streaming).
# Thêm 2 service này vào bây giờ là mở rộng ngoài phạm vi SPEC đã chốt, chỉ
# nên thêm khi có yêu cầu thật (ví dụ khi thật sự chuyển dữ liệu ngân hàng mock
# từ JSON sang 1 database quan hệ ở giai đoạn sau MVP).

# === HƯỚNG DẪN CÀI GDS THỦ CÔNG (thay cho NEO4J_PLUGINS auto-download) ===
# 1. Vào https://neo4j.com/docs/graph-data-science/current/installation/supported-neo4j-versions/
#    để xem bảng tương thích, tìm đúng bản GDS hỗ trợ Neo4j 5.26.
# 2. Tải file .zip/.jar tương ứng từ Neo4j Download Center:
#    https://neo4j.com/deployment-center/#gds-tab  (chọn Neo4j Graph Data Science,
#    bản Community/self-managed)
# 3. Giải nén (nếu là .zip), lấy đúng 1 file "neo4j-graph-data-science-<version>.jar"
# 4. Copy file .jar đó vào thư mục ./neo4j/plugins/ (tạo thư mục này ở gốc project
#    nếu chưa có) -- compose sẽ tự mount vào /plugins bên trong container.
# 5. docker compose down -v && docker compose up -d (xoá volume cũ, tránh cache lỗi)
# 6. Kiểm tra: mở http://localhost:7474, đăng nhập neo4j/<NEO4J_PASSWORD trong .env>,
#    chạy: RETURN gds.version();
#    Nếu trả về 1 chuỗi version (không lỗi "Unknown function") -> GDS đã cài đúng.